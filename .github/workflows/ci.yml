name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Restore and Build Solution
      run: dotnet build LeaseAudit.slnx -c Release

    - name: Run xUnit Tests
      run: dotnet test tests/LeaseAudit.Tests/LeaseAudit.Tests.csproj -c Release --no-build

    - name: Install Playwright and Browsers
      run: |
        cd tests/LeaseAudit.E2E
        npm ci
        npx playwright install --with-deps chromium

    - name: Run Playwright E2E Tests
      run: |
        cd tests/LeaseAudit.E2E
        npx playwright test
