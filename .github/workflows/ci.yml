name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: 'npm'

    - name: Checkout Shared Privacy Telemetry
      run: git clone --depth 1 https://github.com/knowthankyew/privacy-telemetry.git ../privacy-telemetry

    - name: Install Dependencies
      run: npm ci

    - name: Audit Dependencies
      run: npm audit --audit-level=high

    - name: Typecheck
      run: npx tsc --noEmit

    - name: Run Tests
      run: npm test

    - name: Build Application
      run: npm run build

    - name: Generate CycloneDX SBOM
      run: npx --yes @cyclonedx/cdxgen -o bom.json

    - name: Upload SBOM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sbom-lease-audit-cyclonedx
        path: bom.json
